---
# Fixes and patches specifically for Orange Pi Zero3 / AVM boards

- name: Create /usr/share/kvmd/web/kvm symlink to avm
  ansible.builtin.file:
    src: /usr/share/kvmd/web/avm
    dest: /usr/share/kvmd/web/kvm
    state: link
    force: true

- name: Ensure proxy_cookie_path exists for /streamer in nginx
  ansible.builtin.lineinfile:
    path: /etc/kvmd/nginx/kvmd.ctx-server.conf
    insertafter: 'location /streamer'
    line: "\tproxy_cookie_path /streamer/ /;"
    state: present
  ignore_errors: true

- name: Disable auth_request for janus static JS in nginx (if present)
  ansible.builtin.replace:
    path: /usr/share/kvmd/extras/janus/nginx.ctx-server.conf
    regexp: '(location = /share/js/kvm/(?:janus|adapter)\.js\s*\{[^}]*?)(auth_request off;)?(\s*\})'
    replace: '\1\tauth_request off;\n\3'
  ignore_errors: true

- name: Deploy idempotent Python patch script
  ansible.builtin.copy:
    src: apply_kvmd_patches.py
    dest: /tmp/apply_kvmd_patches.py
    owner: root
    group: root
    mode: '0700'

- name: Run PiKVM patches
  ansible.builtin.command: python3 /tmp/apply_kvmd_patches.py
  register: patch_result
  changed_when: patch_result.rc == 10
  failed_when: patch_result.rc not in [0, 10]

- name: Remove temporary patch script
  ansible.builtin.file:
    path: /tmp/apply_kvmd_patches.py
    state: absent

- name: Restart PiKVM services immediately if changed
  ansible.builtin.systemd:
    name: "{{ kvmd_service }}"
    state: restarted
  loop:
    - kvmd-otg
    - kvmd
    - kvmd-nginx
  loop_control:
    loop_var: kvmd_service
  when: patch_result.changed