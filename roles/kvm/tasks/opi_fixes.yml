---
# Fixes and patches specifically for Orange Pi Zero3 / AVM boards

- name: Create /usr/share/kvmd/web/kvm symlink to avm
  ansible.builtin.file:
    src: avm
    dest: /usr/share/kvmd/web/kvm
    state: link
    force: true

- name: Ensure proxy_cookie_path exists for /streamer in nginx
  ansible.builtin.lineinfile:
    path: /etc/kvmd/nginx/kvmd.ctx-server.conf
    insertafter: 'location /streamer'
    line: "\tproxy_cookie_path /streamer/ /;"
    state: present
  ignore_errors: true

- name: Disable auth_request for janus static JS in nginx (if present)
  ansible.builtin.replace:
    path: /usr/share/kvmd/extras/janus/nginx.ctx-server.conf
    regexp: '(location = /share/js/kvm/(?:janus|adapter)\.js\s*\{[^}]*?)(auth_request off;)?(\s*\})'
    replace: '\1\tauth_request off;\n\3'
  ignore_errors: true

- name: Patch htserver.py to handle binary 0x00 ping
  ansible.builtin.command:
    cmd: >-
      python3 -c '
      path = "/usr/lib/python3/dist-packages/kvmd/htserver.py"
      try:
          with open(path, "r") as f:
              content = f.read()
          old_code = "elif (handler := self.__ws_bin_handlers.get(msg.data[0])):"
          new_code = "if msg.data[0] == 0:\n                    await ws.wsr.send_bytes(bytes([0xFF]))\n                elif (handler := self.__ws_bin_handlers.get(msg.data[0])):"
          if "msg.data[0] == 0" not in content and old_code in content:
              content = content.replace(old_code, new_code, 1)
              with open(path, "w") as f:
                  f.write(content)
              print("CHANGED")
      except Exception as e:
          print("ERROR:", e)
      '
  register: htserver_patch
  changed_when: "'CHANGED' in htserver_patch.stdout"
  ignore_errors: true

- name: Patch stream.js to initialize __janus_imported = false
  ansible.builtin.replace:
    path: /usr/share/kvmd/web/share/js/kvm/stream.js
    regexp: 'var __janus_imported = null;'
    replace: 'var __janus_imported = false;'
  ignore_errors: true

- name: Patch session.js WebSocket event dispatcher
  ansible.builtin.command:
    cmd: >-
      python3 -c '
      import re
      path = "/usr/share/kvmd/web/share/js/kvm/session.js"
      try:
          with open(path, "r") as f:
              content = f.read()

          new_handler = """\tvar __wsJsonHandler = function (ev_type, ev) {
          \t\tswitch (ev_type) {
          \t\t\tcase "info": __info.setState(ev); break;
          \t\t\tcase "info_meta_state": __info.setState({ "meta": ev }); break;
          \t\t\tcase "info_hw_state": if (ev && ev.health) __info.setState({ "health": ev }); else if (ev) __info.setState({ "health": ev }); break;
          \t\t\tcase "info_fan_state": __info.setState({ "fan": ev }); break;
          \t\t\tcase "info_system_state": __info.setState({ "system": ev }); break;
          \t\t\tcase "info_extras_state": __info.setState({ "extras": ev }); break;
          \t\t\tcase "gpio":
          \t\t\tcase "gpio_state": __gpio.setState(ev); break;
          \t\t\tcase "gpio_model_state": __gpio.setState({ "model": ev }); break;
          \t\t\tcase "hid":
          \t\t\tcase "hid_state": __hid.setState(ev); break;
          \t\t\tcase "hid_keymaps":
          \t\t\tcase "hid_keymaps_state": __paste.setState(ev); break;
          \t\t\tcase "atx":
          \t\t\tcase "atx_state": __atx.setState(ev); break;
          \t\t\tcase "streamer":
          \t\t\tcase "streamer_state": __streamer.setState(ev); break;
          \t\t\tcase "ocr":
          \t\t\tcase "streamer_ocr_state": __ocr.setState(ev); break;

          \t\t\tcase "msd":
          \t\t\tcase "msd_state":
          \t\t\t\tif (ev.online === false) {
          \t\t\t\t\t__switch.setMsdConnected(false);
          \t\t\t\t} else if (ev.drive !== undefined) {
          \t\t\t\t\t__switch.setMsdConnected(ev.drive.connected);
          \t\t\t\t}
          \t\t\t\t__msd.setState(ev);
          \t\t\t\tbreak;

          \t\t\tcase "switch":
          \t\t\t\tif (ev.model) {
          \t\t\t\t\t__atx.setHasSwitch(ev.model.ports.length > 0);
          \t\t\t\t}
          \t\t\t\t__switch.setState(ev);
          \t\t\t\tbreak;
          \t\t}
          \t};"""

          pattern = r"(\tvar __wsJsonHandler = function \(ev_type, ev\) \{[\s\S]*?\n\t\};)"
          if "streamer_state" not in content and re.search(pattern, content):
              content = re.sub(pattern, new_handler, content, count=1)
              with open(path, "w") as f:
                  f.write(content)
              print("CHANGED")
      except Exception as e:
          print("ERROR:", e)
      '
  register: session_patch
  changed_when: "'CHANGED' in session_patch.stdout"
  ignore_errors: true

- name: Restart KVMD services on Orange Pi boards
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - kvmd-otg
    - kvmd
    - kvmd-nginx
  when: >
    (htserver_patch is defined and htserver_patch.changed) or
    (session_patch is defined and session_patch.changed)
  ignore_errors: true
