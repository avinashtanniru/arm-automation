---
- name: Install dependencies
  ansible.builtin.package:
    name: unzip
    state: present

- name: Check if kvmd-nginx service exists
  ansible.builtin.service_facts:

- name: Set target version variables (Mini)
  ansible.builtin.set_fact:
    target_version: "{{ web_mini_version }}"
    target_zip: "web-mini-{{ web_mini_version }}.zip"
  when: model | default('opi') == 'opi'

- name: Set target version variables (Max)
  ansible.builtin.set_fact:
    target_version: "{{ web_max_version }}"
    target_zip: "web-max-{{ web_max_version }}.zip"
  when: model | default('rpi') == 'rpi'

- name: Check current installed version
  ansible.builtin.slurp:
    src: /usr/share/kvmd/web/version
  register: current_version_b64
  ignore_errors: true

- name: Decode current version
  ansible.builtin.set_fact:
    current_version: "{{ current_version_b64.content | b64decode | trim }}"
  when: current_version_b64.content is defined

- name: Configure KVM service
  ansible.builtin.template:
    src: kvmd-nginx.service.j2
    dest: /lib/systemd/system/kvmd-nginx.service
    mode: '0644'
  notify: Restart KVM

- name: Stop and disable kvmd-webterm
  ansible.builtin.systemd:
    name: kvmd-webterm
    state: stopped
    enabled: no
  ignore_errors: true

- name: Update KVM Web Interface
  block:
    - name: Stop kvmd-nginx service
      ansible.builtin.systemd:
        name: kvmd-nginx
        state: stopped
      when: "'kvmd-nginx.service' in services and services['kvmd-nginx.service'].state == 'running'"

    - name: Get timestamp for backup
      ansible.builtin.command: date +%Y%m%d%H%M%S
      register: timestamp
      changed_when: false

    - name: Check if web folder exists for backup
      ansible.builtin.stat:
        path: /usr/share/kvmd/web
      register: web_folder

    - name: Backup existing web folder
      ansible.builtin.command:
        cmd: "mv /usr/share/kvmd/web /usr/share/kvmd/web_{{ timestamp.stdout }}"
      when: web_folder.stat.exists and web_folder.stat.isdir

    - name: Ensure KVM directory exists
      ansible.builtin.file:
        path: /usr/share/kvmd
        state: directory
        mode: '0755'

    - name: Ensure local files directory exists on controller
      ansible.builtin.file:
        path: "{{ role_path }}/files"
        state: directory
      delegate_to: localhost
      become: false
      run_once: true

    - name: Extract target web zip to KVM directory
      ansible.builtin.unarchive:
        src: "{{ role_path }}/files/{{ target_zip }}"
        dest: /usr/share/kvmd/
        remote_src: no
        extra_opts:
          - "-o"

    - name: Enable and start kvmd-nginx service
      ansible.builtin.systemd:
        name: kvmd-nginx
        state: started
        enabled: yes
      ignore_errors: true

  when: (current_version | default('none')) != target_version

- name: Check current EDID configuration
  ansible.builtin.command: kvmd-edidconf
  register: edid_current
  changed_when: false
  ignore_errors: true

- name: Configure EDID
  ansible.builtin.command: >
    kvmd-edidconf
    --set-mfc-id DEL
    --set-product-id 0x7770
    --set-serial 0x01010101
    --set-monitor-name "Dell U2723QE"
    --set-monitor-serial CAFEBABE
    --set-audio yes
    --apply
  when: >
    'Manufacturer ID: DEL' not in edid_current.stdout or
    'Product ID:      0x7770' not in edid_current.stdout or
    'Serial number:   0x01010101' not in edid_current.stdout or
    'Monitor name:    Dell U2723QE' not in edid_current.stdout or
    'Monitor serial:  CAFEBABE' not in edid_current.stdout or
    'Audio:           yes' not in edid_current.stdout
  ignore_errors: true
  notify: Restart KVM

- name: Configure kvmd override.yaml
  ansible.builtin.template:
    src: override.yaml.j2
    dest: /etc/kvmd/override.yaml
    mode: '0644'
  notify: Restart KVM

- name: Configure kvmd meta.yaml
  ansible.builtin.copy:
    dest: /etc/kvmd/meta.yaml
    content: |
      # You can write down any information and it will be available
      # at the address /api/info?legacy=0
      # To change PiKVM's hostname, use "hostnamectl hostname <new>".

      server:
          host: "avm"
    mode: '0644'
  notify: Restart KVM

- name: Check /etc/kvmd/totp.secret status
  ansible.builtin.stat:
    path: /etc/kvmd/totp.secret
  register: totp_secret_file

- name: Generate 2FA TOTP secret
  ansible.builtin.copy:
    dest: /etc/kvmd/totp.secret
    content: "{{ lookup('ansible.builtin.password', '/dev/null length=32 chars=ABCDEFGHIJKLMNOPQRSTUVWXYZ') }}\n"
    mode: '0600'
  when:
    - enable_2fa | default(false) | bool
    - not totp_secret_file.stat.exists or totp_secret_file.stat.size == 0
  notify: Restart KVM

- name: Clear 2FA TOTP secret content when 2FA is disabled
  ansible.builtin.copy:
    dest: /etc/kvmd/totp.secret
    content: ""
    mode: '0600'
  when: not (enable_2fa | default(false) | bool)
  notify: Restart KVM
